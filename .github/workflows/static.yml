# Publishes the LeanWatch control center (the web/ folder) to GitHub Pages.
# The site root is web/index.html, so https://<user>.github.io/lean-watch/ opens the app.
# Every deploy first runs the browser smoke test against the exact files being published.
name: Deploy LeanWatch to Pages

on:
  push:
    branches: ["claude/bold-bell-tq6s9b"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assemble the site from web/
        run: |
          mkdir -p _site
          cp -r web/index.html web/css web/js _site/
          # Old links to /lean-watch/web/ keep working.
          mkdir -p _site/web
          cat > _site/web/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>LeanWatch</title>
          <meta http-equiv="refresh" content="0; url=../">
          <script>location.replace("../" + location.hash)</script>
          <a href="../">LeanWatch has moved. Open it here.</a>
          HTML

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke test the site as it will be served
        run: |
          mkdir -p /tmp/pages
          cp -r _site /tmp/pages/lean-watch
          python3 -m http.server 8080 --bind 127.0.0.1 --directory /tmp/pages > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/lean-watch/ > /dev/null && break; sleep 0.5; done
          LEANWATCH_URL=http://127.0.0.1:8080/lean-watch/ npm test

      - name: Show the test server log
        if: failure()
        run: cat /tmp/http.log || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
